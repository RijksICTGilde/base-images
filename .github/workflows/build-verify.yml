name: Build and Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      any: ${{ steps.c.outputs.any }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changed-images
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      image: ${{ matrix.image }}
      publish: false

  # Stable required-status-check for branch protection. Passes when every changed
  # image verified — or when nothing changed (verify skipped).
  build-and-verify:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          R="${{ needs.verify.result }}"
          if [ "$R" = "failure" ] || [ "$R" = "cancelled" ]; then
            echo "Image verification failed ($R)"; exit 1
          fi
          echo "OK (verify: ${R:-skipped})"
