name: Build and Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nginx
            context: images/nginx
            image: ghcr.io/rijksictgilde/nginx-base
          - name: haproxy-redirect
            context: images/haproxy-redirect
            image: ghcr.io/rijksictgilde/haproxy-redirect
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      image: ${{ matrix.image }}
      publish: false

  # Stable required-status-check name for branch protection: passes only if every
  # image verified successfully.
  build-and-verify:
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on all images
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "One or more images failed verification"
            exit 1
          fi
          echo "All images verified"
