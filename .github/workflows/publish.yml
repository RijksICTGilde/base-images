name: Publish Base Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # daily rebuild: pulls fresh apk-signed Alpine security patches
  workflow_dispatch:

# Least privilege by default; the publish job raises only what it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create and push the CalVer git tag
      packages: write       # push image to GHCR
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # build-provenance attestation
    env:
      IMAGE: ghcr.io/rijksictgilde/nginx-base
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit   # observe egress first; switch to 'block' + allowlist once stable

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate CalVer tag
        id: version
        run: |
          YEAR_MONTH=$(date +%Y.%m)
          EXISTING=$(git tag --list "${YEAR_MONTH}.*" | sort -V | tail -n1)
          if [ -z "$EXISTING" ]; then
            PATCH=0
          else
            LAST_PATCH=${EXISTING##*.}
            PATCH=$((LAST_PATCH + 1))
          fi
          echo "version=${YEAR_MONTH}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build once locally and gate on security before pushing -----------

      - name: Build image (local, for scanning)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: nginx-base:candidate
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.version.outputs.created }}

      - name: Trivy CVE scan (gate — block vulnerable publishes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nginx-base:candidate
          scan-type: image
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Smoke test (non-root, config, responds)
        run: |
          docker run --rm nginx-base:candidate nginx -t
          UID_VAL=$(docker run --rm nginx-base:candidate id -u)
          [ "$UID_VAL" != "0" ] || { echo "FAIL: running as root"; exit 1; }
          docker run -d --name smoke -p 8080:8080 nginx-base:candidate
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          docker logs smoke; docker stop smoke
          [ "$STATUS" = "200" ] || [ "$STATUS" = "403" ] || [ "$STATUS" = "404" ] || { echo "FAIL: server did not respond (got $STATUS)"; exit 1; }

      # --- Publish, sign and attest -----------------------------------------

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.version.outputs.created }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (GitHub-native)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create git tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git tag "$VERSION"
          git push origin "$VERSION"
