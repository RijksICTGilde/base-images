name: Publish Base Images

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # daily rebuild of ALL images: fresh apk-signed Alpine patches
  workflow_dispatch:
    inputs:
      image:
        description: 'Build only this image (empty = all)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      any: ${{ steps.c.outputs.any }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changed-images
        with:
          # Daily rebuild and a no-arg manual run build everything; a push to main
          # builds only the images that changed; a dispatch with an image name
          # builds just that one.
          only: ${{ github.event.inputs.image }}
          all: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          base: ${{ github.event.before }}

  publish:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: write       # create and push the CalVer git tag
      packages: write       # push image to GHCR
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # build-provenance attestation
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      image: ${{ matrix.image }}
      publish: true
