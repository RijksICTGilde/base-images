name: Publish Base Images

# No timer: images are rebuilt when there is a reason. A push to main builds the
# images that changed; scan.yml dispatches a build for an image whose published
# `latest` has a fixable CVE or pending Alpine updates; a manual dispatch builds
# one image or all of them.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: 'Build only this image (empty = all)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.c.outputs.matrix }}
      any: ${{ steps.c.outputs.any }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/changed-images
        with:
          # A no-arg manual run builds everything; a push to main builds only the
          # images that changed; a dispatch with an image name (manual, or from
          # scan.yml) builds just that one.
          only: ${{ github.event.inputs.image }}
          all: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          base: ${{ github.event.before }}

  publish:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: write       # create and push the CalVer git tag
      packages: write       # push image to GHCR
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # build-provenance attestation
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      image: ${{ matrix.image }}
      publish: true
