name: Publish Base Images

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # daily rebuild: pulls fresh apk-signed Alpine security patches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nginx
            context: images/nginx
            image: ghcr.io/rijksictgilde/nginx-base
          - name: haproxy-redirect
            context: images/haproxy-redirect
            image: ghcr.io/rijksictgilde/haproxy-redirect
    permissions:
      contents: write       # create and push the CalVer git tag
      packages: write       # push image to GHCR
      id-token: write       # keyless cosign signing + provenance (OIDC)
      attestations: write   # build-provenance attestation
    uses: ./.github/workflows/reusable-image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      image: ${{ matrix.image }}
      publish: true
