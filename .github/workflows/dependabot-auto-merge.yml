name: Dependabot auto-merge

# Auto-merge ONLY patch/minor dependency bumps, and only after required status
# checks (build-verify) pass via branch protection. Major bumps are left for a
# human to review. Combined with Dependabot's 7-day cooldown, this means we only
# ever auto-merge aged, community-vetted releases — see SECURITY.md.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          # Only talks to the GitHub API (fetch-metadata + gh pr merge).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch/minor
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
