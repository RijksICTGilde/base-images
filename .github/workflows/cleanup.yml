name: Registry housekeeping

# Tagged versions are never deleted. Consumers pin by digest and bump at their
# own pace; whether a version is still safe to run is their call, informed by
# the daily scan (scan.yml), not ours to enforce by deleting it. Builds are
# event-driven, so the catalogue grows by a handful of versions per month.
#
# This only removes what nobody can reference: untagged manifests left behind
# by push-by-digest, orphaned referrers, and ghost multi-arch indexes. The
# cosign signatures / SBOM / provenance attestations of every tagged version
# are kept intact.

on:
  schedule:
    - cron: '0 4 * * *'   # daily housekeeping of untagged/orphaned manifests only
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate only (list what would be deleted, delete nothing)'
        type: string
        default: 'true'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write   # delete package versions
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443

      - name: Remove untagged, orphaned and ghost manifests
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: RijksICTGilde
          package: nginx-base,haproxy-redirect
          # Scheduled run prunes for real; manual dispatch defaults to dry-run.
          dry-run: ${{ inputs.dry_run || 'false' }}
          # No older-than / keep-n-tagged: tagged versions are never candidates.
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          validate: true
