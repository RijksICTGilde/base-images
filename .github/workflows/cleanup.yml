name: Cleanup old images

# Builds are event-driven (see scan.yml), so a handful of versions per month
# accumulate rather than one per night. Consumers pin by digest and bump at
# their own pace, so old versions stay pullable for half a year. This prunes
# beyond that while never orphaning the cosign signatures / SBOM / provenance
# attestations of images we keep. Whether an old version still has open CVEs
# is reported by scan.yml, not enforced by deletion: deleting a digest breaks
# the builds of exactly the consumers who have not bumped yet.
#
# Policy: delete versions older than 180 days, but always keep the 12 newest
# tagged versions + `latest`. Untagged/orphaned manifests are removed.

on:
  schedule:
    - cron: '0 4 * * *'   # daily; prunes only what crossed the 180-day line
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate only (list what would be deleted, delete nothing)'
        type: string
        default: 'true'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write   # delete package versions
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443

      - name: Prune old image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: RijksICTGilde
          package: nginx-base,haproxy-redirect
          # Scheduled run prunes for real; manual dispatch defaults to dry-run.
          dry-run: ${{ inputs.dry_run || 'false' }}
          older-than: 180 days
          keep-n-tagged: 12
          exclude-tags: latest
          delete-untagged: true
          delete-orphaned-images: true
          delete-ghost-images: true
          validate: true
