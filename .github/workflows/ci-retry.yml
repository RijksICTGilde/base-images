name: Retry on runner failure

# GitHub-hosted runners sometimes cannot reach github.com while the job starts
# (checkout fails within milliseconds) and the job then never finishes. The job
# timeouts end such a run; this workflow starts it again, at most twice.
# Only failures in the job setup steps are retried, never test or scan failures.

on:
  workflow_run:
    workflows: ["Build and Verify", "Publish Base Images"]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # rerun the failed jobs
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Rerun if a setup step failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          failed=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs" --paginate \
            --jq '.jobs[].steps[]? | select(.conclusion == "failure") | .name')
          echo "Failed steps:"; echo "${failed:-none}"
          if echo "$failed" | grep -qE '^(Set up job|Pre Harden runner|Harden runner|Run actions/checkout)'; then
            echo "Setup failure, rerunning (attempt ${ATTEMPT})"
            gh run rerun "${RUN_ID}" --failed
          else
            echo "Not a setup failure, leaving it"
          fi
