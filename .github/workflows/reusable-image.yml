name: Build image (reusable)

# Shared build/scan/test/sign/publish logic for every image under images/<name>/.
# Callers pass the image name, its build context, and its GHCR image ref.
# verify mode (publish=false): build -> scan -> test, upload SARIF to Security tab.
# publish mode (publish=true): + push by digest -> sign -> attest -> promote tags.

on:
  workflow_call:
    inputs:
      name:
        description: short image name, e.g. nginx
        required: true
        type: string
      context:
        description: build context dir, e.g. images/nginx
        required: true
        type: string
      image:
        description: full GHCR image ref to publish to
        required: true
        type: string
      publish:
        description: sign and publish (true) or verify only (false)
        required: false
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          # Shared allowlist for all images: GitHub/Actions, container registries,
          # Alpine CDN (apk upgrade), Trivy DB, and sigstore (keyless sign + attest).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            token.actions.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudfront.docker.com:443
            dl-cdn.alpinelinux.org:443
            mirror.gcr.io:443
            check.trivy.dev:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # --- Build locally and gate on security + function before any push ----

      - name: Build candidate (local)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          load: true
          tags: candidate:${{ inputs.name }}
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}

      - name: Trivy CVE scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:${{ inputs.name }}
          scan-type: image
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy config scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.context }}/Dockerfile
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Functional test
        run: |
          chmod +x "${{ inputs.context }}/test.sh"
          "${{ inputs.context }}/test.sh" "candidate:${{ inputs.name }}"

      # --- verify mode: publish findings to the Security tab ----------------

      - name: Trivy CVE scan (SARIF)
        if: ${{ !inputs.publish }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:${{ inputs.name }}
          scan-type: image
          format: sarif
          output: trivy-${{ inputs.name }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload SARIF
        if: ${{ !inputs.publish }}
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # v2.25.5
        with:
          sarif_file: trivy-${{ inputs.name }}.sarif
          category: ${{ inputs.name }}

      # --- publish mode: push by digest, sign, attest, then expose tags -----

      - name: Generate CalVer tag
        if: ${{ inputs.publish }}
        id: version
        run: |
          PREFIX="${{ inputs.name }}"
          YM=$(date +%Y.%m)
          EXISTING=$(git tag --list "${PREFIX}/${YM}.*" | sort -V | tail -n1)
          if [ -z "$EXISTING" ]; then PATCH=0; else PATCH=$(( ${EXISTING##*.} + 1 )); fi
          echo "version=${YM}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        if: ${{ inputs.publish }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          sbom: true
          provenance: mode=max
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Install cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, OIDC)
        if: ${{ inputs.publish }}
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote to release tags
        if: ${{ inputs.publish }}
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"

      - name: Create git tag
        if: ${{ inputs.publish }}
        run: |
          TAG="${{ inputs.name }}/${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
