worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Hide nginx version (in Server header and error pages).
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Static sites only serve GET/HEAD; reject everything else.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Never serve dotfiles (.git, .env, .htaccess, ...); .well-known stays reachable.
        location ~ /\.(?!well-known) {
            return 404;
        }

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        error_page 404 /404.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            # Re-include headers: any add_header in a location drops inherited ones.
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
