global
    log stdout format raw local0
    maxconn 256
    nbthread 1

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

frontend in
    bind *:8080

    # Health endpoints for Kubernetes probes. `/healthz` (liveness) and
    # `/readyz` (readiness) follow the Kubernetes naming convention; this image
    # has no upstream, so the two are equivalent and answer identically.
    #
    # Must come before the redirect rule below, otherwise a probe gets a 302
    # instead of a 200. Logging is silenced: probe traffic runs every few
    # seconds forever and says nothing about the redirects we do care about.
    acl is_health path /healthz /readyz
    http-request set-log-level silent if is_health
    http-request return status 200 content-type "text/plain" string "ok" if is_health

    http-request set-var(txn.target) str("${TARGET_URL}"),regsub("/+\$","")
    http-request redirect prefix "%[var(txn.target)]" code 302
