# Shared security headers — included at both server and location scope.
#
# nginx's add_header is NOT cumulative: a location block that defines any
# add_header drops ALL headers inherited from the server block. Including this
# same snippet everywhere keeps the full set present on every response
# (including cached static assets), instead of silently losing headers.
#
# Consumers can tighten these (e.g. a stricter Content-Security-Policy with
# default-src 'self') by shipping their own /etc/nginx/security-headers.conf.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Non-breaking CSP baseline: blocks plugin injection, <base> hijacking and
# clickjacking without restricting where scripts/styles/images load from.
# Tighten per-site with default-src/script-src as needed.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
