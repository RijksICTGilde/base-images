# Reverse-proxy defaults for a WebSocket (or mixed HTTP + WebSocket) backend.
# Standalone: use this INSTEAD of snippets/proxy.conf in the same location.
#
#   location /ws/ {
#       include /etc/nginx/snippets/proxy-websocket.conf;
#       proxy_pass http://backend:8080;
#   }

proxy_http_version 1.1;

# Only ask the backend to upgrade when the client did ($connection_upgrade is
# mapped in nginx.conf); plain HTTP requests through this location still work.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

# An idle socket must not be cut after nginx's default 60s.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

proxy_hide_header X-Powered-By;

include /etc/nginx/security-headers.conf;
