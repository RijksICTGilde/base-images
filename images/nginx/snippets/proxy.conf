# Reverse-proxy defaults. Include it inside a location that has proxy_pass,
# shipped as /etc/nginx/locations.d/<name>.conf in your image:
#
#   location /api/ {
#       include /etc/nginx/snippets/proxy.conf;
#       proxy_pass http://backend:8080;
#   }
#
# Deliberately small so it never collides with your own directives (nginx
# rejects a directive set twice in one location). Add per location as needed:
#   client_max_body_size 50m;     # uploads (default 1m)
#   proxy_read_timeout   300s;    # slow backends (default 60s)
#   proxy_buffering      off;     # streaming responses / SSE
# For WebSockets use snippets/proxy-websocket.conf instead of this file.
#
# Methods are not restricted here: the backend decides. Static content under
# `location /` stays GET/HEAD-only.

proxy_http_version 1.1;

# Tell the backend who asked and how. X-Forwarded-For is appended to, so an
# ingress in front of us keeps the real client address at the front.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

# Don't leak the backend's framework. (nginx already replaces the Server header.)
proxy_hide_header X-Powered-By;

# add_header in a location drops the inherited set, so re-include the security
# headers. If the backend sends its own Content-Security-Policy, browsers
# enforce both (the stricter combination wins). To let the backend's CSP rule
# alone, ship a /etc/nginx/security-headers.conf without CSP; to drop the
# backend's, add `proxy_hide_header Content-Security-Policy;` to the location.
include /etc/nginx/security-headers.conf;
