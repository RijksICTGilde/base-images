# One worker, on purpose. `worker_processes auto` starts one worker per CPU core
# of the *node*, not of the pod: a Kubernetes CPU limit does not cap it. On a
# large node that means ~200 workers and hundreds of MB per pod (and OOMKills
# when the memory limit is tight). One worker with 1024 connections serves
# thousands of concurrent users for static content or a light reverse proxy.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Hide nginx version (in Server header and error pages).
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    # Helpers used by /etc/nginx/snippets/proxy*.conf.
    # Pass the original scheme through when an ingress in front of us set it.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    # WebSocket upgrade: only ask the backend to upgrade when the client did.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Extension point (http scope). Drop files in /etc/nginx/conf.d/ for
    # upstream{} blocks, maps, a resolver, limit_req zones or an extra server{}.
    # The upstream image's conf.d/default.conf is removed in the Dockerfile.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Never serve dotfiles (.git, .env, .htaccess, ...); .well-known stays reachable.
        # Deliberately global: it also shields proxied prefixes (/api/.env -> 404).
        location ~ /\.(?!well-known) {
            return 404;
        }

        # Health endpoints for Kubernetes probes. `/healthz` (liveness) and
        # `/readyz` (readiness) follow the Kubernetes naming convention; for a
        # static file server the two are equivalent, so both answer identically.
        #
        # Answered by nginx itself rather than from disk, so a probe stays green
        # regardless of what the downstream image copies into the docroot, and
        # `access_log off` keeps probe traffic (every few seconds, forever) out
        # of the logs. Exact-match locations take precedence over the regex
        # locations below, so these paths can never be shadowed by site content.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Extension point (server scope). Drop files in /etc/nginx/locations.d/
        # for reverse-proxy locations and other per-site rules, e.g.:
        #
        #   location /api/ {
        #       include /etc/nginx/snippets/proxy.conf;
        #       proxy_pass http://backend:8080;
        #   }
        #
        # A prefix location here beats `location /` below, and the static-asset
        # rules are nested inside `location /`, so they cannot capture /api/x.png.
        # Method policy for proxied paths is the backend's: no GET/HEAD-only here.
        include /etc/nginx/locations.d/*.conf;

        location / {
            # Static content only needs GET/HEAD; reject everything else.
            # Scoped to this location so proxy locations can allow POST etc.
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }

            try_files $uri $uri/index.html $uri/ =404;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
                if ($request_method !~ ^(GET|HEAD)$) {
                    return 405;
                }
                # Re-include headers: any add_header in a location drops inherited ones.
                include /etc/nginx/security-headers.conf;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }
        }

        error_page 404 /404.html;
    }
}
